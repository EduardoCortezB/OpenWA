# ============================================================
# OpenWA — Docker Compose (Dokploy / Producción)
# 3 servicios: api · frontend · nginx (proxy único)
# PostgreSQL y Redis son EXTERNOS — configurar en .env
# Red y volumen de datos son EXTERNOS (creados por Dokploy)
# ============================================================

services:
  api-openwa:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - openwa-data:/app/data
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  frontend-openwa:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  nginx-openwa:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-openwa:
        condition: service_healthy
      frontend-openwa:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  openwa-data:
    external: true

networks:
  dokploy-network:
    external: true
