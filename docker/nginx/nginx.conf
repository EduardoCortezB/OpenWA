events {
    worker_connections 1024;
}

http {
    # Usar el resolver DNS interno de Docker para resolución dinámica
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        # Permitir uploads grandes (media/archivos)
        client_max_body_size 100m;

        # Proxy API
        location /api/ {
            set $backend http://api-openwa:2785;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_request_buffering off;
        }

        # Proxy WebSocket
        location /socket.io/ {
            set $backend http://api-openwa:2785;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Archivos de media servidos por el backend
        # IMPORTANTE: con variable en proxy_pass NO se puede usar URI fijo,
        # se usa $request_uri para reenviar exactamente la URL del cliente.
        location ^~ /media/ {
            set $backend http://api-openwa:2785;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend SPA
        # Evita servir HTML viejo tras deploy (si no, referencia chunks con hash antiguos).
        location = / {
            set $frontend http://frontend-openwa:80;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~* \.html$ {
            set $frontend http://frontend-openwa:80;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location / {
            set $frontend http://frontend-openwa:80;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
